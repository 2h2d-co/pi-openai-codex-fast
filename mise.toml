[settings]
lockfile = true
locked = true
minimum_release_age = "7d"

[tools]
node = "22"
npm = "11"
hk = { version = "1.50.0", postinstall = "hk install --mise" }
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.26.1"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[shell_alias]
"pi:local" = "command pi --no-extensions -e {{config_root}}"
"pi:npm" = "command pi --no-extensions -e npm:pi-openai-codex-fast"

[tasks.benchmark]
description = "Run the full OpenAI Codex Fast benchmark suite against the local extension"
run = "node benchmarks/run.ts"
