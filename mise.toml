[settings]
lockfile = true
locked = true
minimum_release_age = "7d"

[tools]
node = "22.23.2"
npm = "11.19.0"
hk = { version = "1.56.0", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.29.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[shell_alias]
"pi:local" = "pi --no-extensions -e {{config_root}}"
"pi:npm" = "pi --no-extensions -e npm:pi-openai-codex-fast"
