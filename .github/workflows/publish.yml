name: Stage npm release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: npm-stage-publish
  cancel-in-progress: false

jobs:
  stage:
    if: "${{ github.event.head_commit != null && startsWith(github.event.head_commit.message, 'release: v') }}"
    name: Stage npm package
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: "2026.6.14"
          install_args: --locked
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate release and derive npm dist-tag
        id: release
        run: node ./scripts/ci-publish-checks.ts

      - name: Stage package on npm
        run: npm stage publish --tag "$NPM_DIST_TAG" --allow-directory=all
        env:
          NPM_CONFIG_ALLOW_DIRECTORY: all
          NPM_DIST_TAG: "${{ steps.release.outputs.npm_tag }}"
